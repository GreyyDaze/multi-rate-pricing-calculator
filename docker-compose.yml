services:
  db:
    image: postgres:16-alpine
    container_name: calculator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calculator
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calculator"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-db:
    image: postgres:16-alpine
    container_name: calculator-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calculator_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calculator_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data: